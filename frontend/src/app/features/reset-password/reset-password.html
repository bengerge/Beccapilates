<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Új jelszó beállítása</h2>
      <p>Kérlek, add meg az új jelszavadat a BeccaPilates fiókodhoz.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="newPassword">Új jelszó</label>
        <input 
          type="password" 
          id="newPassword" 
          name="newPassword" 
          [(ngModel)]="newPassword" 
          required 
          minlength="6"
          #passCtrl="ngModel"
          [class.invalid]="passCtrl.invalid && passCtrl.touched"
        >
        @if (passCtrl.invalid && passCtrl.touched) {
          <small class="error-text">A jelszónak legalább 6 karakter hosszúnak kell lennie.</small>
        }
      </div>

      <div class="form-group">
        <label for="confirmPassword">Jelszó megerősítése</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          required 
          #confirmCtrl="ngModel"
          [class.invalid]="(confirmCtrl.invalid && confirmCtrl.touched) || (newPassword !== confirmPassword && confirmCtrl.touched)"
        >
        @if (newPassword !== confirmPassword && confirmCtrl.touched) {
          <small class="error-text">A jelszavak nem egyeznek.</small>
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="resetForm.invalid || newPassword !== confirmPassword || isSubmitting">
        {{ isSubmitting ? 'Mentés...' : 'Jelszó mentése' }}
      </button>
    </form>
  </div>
</div>
