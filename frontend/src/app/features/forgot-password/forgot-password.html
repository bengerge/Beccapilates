<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Elfelejtett jelszó</h2>
      <p>Add meg az e-mail címed, és küldünk egy linket a jelszavad visszaállításához.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email">E-mail cím</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          email
          #emailCtrl="ngModel"
          [class.invalid]="emailCtrl.invalid && emailCtrl.touched"
          placeholder="pelda@email.com"
        >
        @if (emailCtrl.invalid && emailCtrl.touched) {
          <small class="error-text">Érvényes e-mail cím megadása kötelező.</small>
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="forgotForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Küldés...' : 'Visszaállító link küldése' }}
      </button>
    </form>
  </div>
</div>
